#-----------------------------------------------------------------------
# 전자정부 표준프레임워크 공통컴포넌트(v5.0.7) globals.properties 중 이 프로젝트가 사용하는 키만 남긴 파일
# - DB 접속 정보는 공통컴포넌트 방식(Globals.<db>.*)을 쓰지 않고 application-*.yml 로 설정한다.
# - 비밀번호 등 비밀 값을 이 파일에 적지 않는다.
#-----------------------------------------------------------------------

# 운영체제 구분 (WINDOWS / UNIX)
Globals.OsType = UNIX

# DB 종류 (공통컴포넌트 매퍼 파일명 *_SQL_<DbType>.xml 과 일치해야 한다)
Globals.DbType = postgres

# 사용자 인증 방식: session(세션) / security(Spring Security) / dummy
# session 방식은 공통컴포넌트 5.0.7 에서 권한 조회가 순환 호출되어 관리자 판정이 불가능하므로 security 를 사용한다.
Globals.Auth = security

# 로그인 후 이동할 메인 페이지
Globals.MainPage = /main.do

# 로그인 인증 제한 (연속 실패 횟수 초과 시 계정 잠금)
Globals.login.Lock = true
Globals.login.LockCount = 5

# 비밀번호 유효기간(일)
Globals.ExpirePwdDay = 180

# 파일 업로드
Globals.fileStorePath = ./data/upload/
Globals.SynchrnServerPath = ./data/upload/Synch/
Globals.fileUpload.Extensions = .gif,.jpg,.jpeg,.png,.xls,.xlsx
Globals.fileUpload.maxSize = 104857600
Globals.fileUpload.maxRequestSize = 104857600
Globals.fileUpload.maxFileCount = 1000

# 발송메일 요청/응답 파일 경로
Globals.MailRequestPath   = mail/request/
Globals.MailRResponsePath = mail/response/

# 설정 파일 경로 (공통컴포넌트의 시스템 관리 기능용)
Globals.ShellFilePath     = globals.properties
Globals.ServerConfPath    = conf/server.properties
Globals.ClientConfPath    = conf/client.properties
Globals.FileFormatPath    = conf/format.properties
Globals.ConfPath          = conf
Globals.SmsDbConfPath     = conf/smsdb.properties
