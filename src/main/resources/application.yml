server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # 주소창에 ;jsessionid=... 가 붙지 않도록 쿠키로만 세션을 추적
      tracking-modes: cookie

spring:
  profiles:
    # 기본은 local(내장 PostgreSQL). 운영은 SPRING_PROFILES_ACTIVE=prod
    default: local
  messages:
    # EgovAbstractServiceImpl 의 messageSource (예외 메시지 키)
    basename: messages/message
    encoding: UTF-8
  datasource:
    # 표준프레임워크 설정 규칙: 커넥션 풀 설정 (HikariCP)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  mvc:
    # 공통컴포넌트 메시지는 한국어(_ko)만 쓰므로 로케일을 한국어로 고정
    locale: ko
    locale-resolver: fixed
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  flyway:
    enabled: true
    # {vendor}: postgresql / mariadb 등 접속한 DB 종류의 폴더를 자동 선택
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}

mybatis:
  mapper-locations:
    - classpath:mapper/**/*.xml
    # 공통컴포넌트 매퍼 (Globals.DbType=postgres)
    - classpath:egovframework/mapper/com/**/*_SQL_postgres.xml
  configuration:
    map-underscore-to-camel-case: true
