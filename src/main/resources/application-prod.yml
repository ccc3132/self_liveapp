# 운영(외부 DB) 실행용: 값은 환경변수로 주입한다. 비밀번호를 파일에 적지 않는다.
#   SPRING_PROFILES_ACTIVE=prod
#   DB_URL=jdbc:postgresql://localhost:5432/egovweb
#   DB_USER=egov
#   DB_PASSWORD=...
# HTTPS 뒤에서 띄우는 것을 전제로 한다(세션 쿠키 Secure). HTTP로 직접 띄우면 쿠키가 전송되지
# 않아 로그인이 안 되니, 앞에 리버스 프록시(HTTPS 종료)를 두거나 server.ssl.* 로 TLS를 직접 설정하라.
server:
  servlet:
    session:
      cookie:
        secure: true

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

logging:
  file:
    name: ${APP_LOG_FILE:logs/egov-web-practice.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
